<section class="home-page">
  <header class="page-header">
    <h1>Popular Movies</h1>

    <p>Discover what's popular right now.</p>
  </header>

  <app-search-bar (searchSubmitted)="onSearch($event)" />

  @if (isLoading()) {
    <app-loading-spinner message="Loading popular movies..." />
  }

  @if (errorMessage()) {
    <app-error-message [message]="errorMessage()" (retry)="loadPopularMovies()" />
  }

  @if (!isLoading() && !errorMessage()) {
    @if (movies().length > 0) {
      <section class="movie-grid">
        @for (movie of movies(); track movie.id) {
          <app-media-card [movie]="movie" />
        }
      </section>
    } @else {
      <p class="empty-state">No popular movies are available right now. Please try again later.</p>
    }
  }
</section>
