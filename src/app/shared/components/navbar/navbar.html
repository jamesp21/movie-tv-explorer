<nav class="navbar" aria-label="Main navigation">
  <a class="navbar__brand" routerLink="/" aria-label="Movie Explorer home"> Movie Explorer </a>

  <div class="navbar__links">
    <a
      routerLink="/"
      routerLinkActive="navbar__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>

    <a routerLink="/search" routerLinkActive="navbar__link--active"> Search </a>

    <a routerLink="/favorites" routerLinkActive="navbar__link--active">
      Favorites

      @if (favoritesService.favoriteCount() > 0) {
        <span
          class="navbar__favorites-count"
          [attr.aria-label]="favoritesService.favoriteCount() + ' saved items'"
        >
          {{ favoritesService.favoriteCount() }}
        </span>
      }
    </a>
  </div>
</nav>
