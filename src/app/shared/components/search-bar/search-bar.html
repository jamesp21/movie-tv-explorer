<form class="search-bar" (submit)="onSearch($event)">
  <input
    id="media-search"
    type="search"
    aria-label="Search movies and TV shows"
    placeholder="Search movies and TV shows..."
    [value]="query()"
    (input)="query.set($any($event.target).value)"
  />

  <button type="submit">Search</button>
</form>
